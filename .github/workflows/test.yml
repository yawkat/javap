name: Check
on:
  push:
    branches: [ master ]
  # The runs of PRs opened by update-flake.yml (with GITHUB_TOKEN) wait for
  # approval: "Approve and run" on the PR starts them.
  pull_request:
  # Started by renovate-deps.yml after it pushes the regenerated dependency pins.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Cache nix store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /nix
          key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/sdks.nix', 'nix/deps.json', 'kotlin-js-store/yarn.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
      - name: Build SDKs
        run: nix build .#sdks -o sdk
      - name: Build package
        # Builds the app fully offline from nix/deps.json and the yarn hash in flake.nix, so this fails if either
        # falls out of sync with the actual gradle/yarn dependency graph. Refresh them with `nix run .#update-deps`.
        run: nix build .#default -L
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Check
        run: nix develop --command ./gradlew check
        env:
          DISABLE_BUBBLEWRAP: true
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
